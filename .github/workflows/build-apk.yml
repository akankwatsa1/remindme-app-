name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (skip Electron download — not needed for Android)
        run: npm ci --ignore-scripts

      - name: Sync Capacitor web assets into the Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses (for any auto-downloaded components)
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build the debug APK (signed with the debug key — installable)
        run: cd android && ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: remindme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
